name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run python -m compileall -q src
      - run: |
          uv run python - <<'PY'
          from forge_bench.reporting import ci95
          from forge_bench.swebench_backend import Candidate, patch_features, select_spread

          m, lo, hi, n = ci95([1, 2, 3])
          assert n == 3 and lo <= m <= hi

          f = patch_features("""diff --git a/a.py b/a.py
          --- a/a.py
          +++ b/a.py
          @@ -1 +1,2 @@
          -old
          +new
          +more
          """)
          assert f["patch_files"] == 1
          assert f["patch_hunks"] == 1
          assert f["patch_changed_lines"] == 3

          candidates = []
          for i, score in enumerate((0.18, 0.49, 0.81, 0.95)):
              candidates.append(Candidate(
                  instance_id=f"x-{i}", repo=f"org/r{i}", base_commit="a"*40,
                  difficulty="medium", problem_statement="", version="",
                  patch_files=1, patch_hunks=1, patch_additions=1,
                  patch_deletions=1, patch_changed_lines=2, patch_chars=100,
                  fail_to_pass_count=1, pass_to_pass_count=1,
                  historical_solve_rate=0.5, historical_submissions=10,
                  complexity_score=score,
              ))
          chosen = select_spread(candidates, count=3)
          assert [c.instance_id for c in chosen] == ["x-0", "x-1", "x-2"]
          assert [c.selection_rank for c in chosen] == ["low", "mid", "high"]
          PY
      - run: uv run forge-bench --help
      - name: Inspect low-range candidate pool
        run: |
          uv run python - <<'PY'
          from pathlib import Path
          from forge_bench.swebench_backend import load_rows, build_candidates
          rows = load_rows("verified", "test")
          candidates, meta = build_candidates(
              rows,
              difficulty="medium",
              cache_root=Path("/tmp/forge-bench-cache"),
              use_history=True,
          )
          low = [
              c for c in candidates
              if c.historical_solve_rate is not None
              and 0.70 <= c.historical_solve_rate <= 0.90
          ]
          low.sort(key=lambda c: (c.patch_changed_lines, c.patch_files, c.instance_id))
          print("LOW_RANGE_CANDIDATES")
          for c in low:
              print(
                  c.instance_id,
                  c.repo,
                  f"solve={c.historical_solve_rate:.3f}",
                  f"lines={c.patch_changed_lines}",
                  f"files={c.patch_files}",
                  f"hunks={c.patch_hunks}",
                  f"scope={c.patch_scope_percentile:.3f}",
                  sep=" | ",
              )
          PY
