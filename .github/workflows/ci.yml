name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run python -m compileall -q src
      - run: |
          uv run python - <<'PY'
          import json
          import subprocess
          import tempfile
          from importlib.metadata import version
          from pathlib import Path

          import yaml

          from forge_bench.cli import build_run_plan
          from forge_bench.designs import ModelSpec, load_design
          from forge_bench.config import (
              ARMS,
              DEFAULT_ANCHOR_IDS,
              DEFAULT_ARMS,
              DEFAULT_EXPECTED_IDS,
              DEFAULT_SAMPLE_SIZE,
              DEFAULT_TOOLSETS,
              LEAN_TOOLSETS,
              PINNED_MAX_TURNS,
              PINNED_REASONING,
              Result,
          )
          from forge_bench.advanced_analysis import (
              DARK_TREATMENT_COLORS,
              LIGHT_TREATMENT_COLORS,
              cost_time_analysis,
              factorial_regression,
              latency_efficiency_analysis,
              timing_evidence_summary,
              time_budget_analysis,
              paired_effects,
              pca_analysis,
              treatment_regression,
              write_advanced_analysis,
          )
          from forge_bench.harness import (
              diff_stats,
              docker_hermes_argv,
              load_swebench_report,
              make_profile,
              pin_profile_route,
          )
          from forge_bench.trace_capture import (
              TRACE_PLUGIN_NAME,
              finalize_event_artifacts,
              summarize_events,
          )
          from forge_bench.reporting import (
              ci95,
              create_reanalysis_output_dir,
              model_pairwise_effects,
              write_experiment_reports,
              write_html_report,
          )
          from forge_bench.swebench_backend import (
              Candidate,
              dataset_revision,
              patch_features,
              select_anchor_neighborhood,
              select_spread,
          )

          assert len(ARMS) == 6
          assert list(DEFAULT_ARMS) == ["baseline", "caveman", "ponytail", "caveman_ponytail"]
          assert DEFAULT_SAMPLE_SIZE == 5
          assert list(DEFAULT_ANCHOR_IDS) == ["django__django-13516", "pytest-dev__pytest-7571"]
          assert list(DEFAULT_EXPECTED_IDS) == [
              "django__django-13516",
              "pytest-dev__pytest-7571",
              "django__django-15731",
              "django__django-16662",
              "django__django-7530",
          ]
          assert ARMS["caveman_ponytail"] == (True, True, False)
          assert ARMS["lean_tools"] == (False, False, True)
          assert DEFAULT_TOOLSETS == "hermes-cli"
          assert LEAN_TOOLSETS == "file,terminal,skills,code_execution"
          assert PINNED_REASONING == "none"
          assert PINNED_MAX_TURNS == 50
          assert version("swebench") == "4.1.0"
          assert dataset_revision("verified") == "78f471bf655a3137b2e8a75af1501690ec009ec3"
          assert DARK_TREATMENT_COLORS["baseline"] == "#94A3B8"
          assert DARK_TREATMENT_COLORS["caveman"] == "#FBBF24"
          assert DARK_TREATMENT_COLORS["ponytail"] == "#22D3EE"
          assert DARK_TREATMENT_COLORS["caveman_ponytail"] == "#A78BFA"
          assert LIGHT_TREATMENT_COLORS["baseline"] == "#64748B"

          design = load_design(Path("designs/deepseek-v4-v41-relace.yaml"))
          assert design.name == "deepseek-v4-v41-relace"
          assert design.blocks == 1
          assert design.analysis_mode == "advanced"
          assert len(design.models) == 2
          assert [model.model for model in design.models] == [
              "deepseek/deepseek-v4-flash-0731",
              "deepseek/deepseek-v4.1-flash",
          ]
          assert {model.upstream_provider for model in design.models} == {"relace"}
          assert all(model.reasoning == "none" for model in design.models)
          assert len(design.instance_ids or ()) == 5

          m, lo, hi, n = ci95([1, 2, 3])
          assert n == 3 and lo <= m <= hi

          with tempfile.TemporaryDirectory() as td:
              source = Path(td) / "forge-bench-example"
              source.mkdir()
              first = create_reanalysis_output_dir(source, analysis_mode="advanced")
              second = create_reanalysis_output_dir(source, analysis_mode="advanced")
              assert first.parent == source / "reanalysis"
              assert second.parent == source / "reanalysis"
              assert first != second
              assert first.is_dir() and second.is_dir()
              assert first.name.endswith("-advanced")
              assert second.name.startswith(first.name + "-") or second.name.endswith("-advanced")

          with tempfile.TemporaryDirectory() as td:
              report_dir = Path(td)
              summary = [{
                  "label": "Baseline",
                  "tasks_valid": 5,
                  "tasks_expected": 5,
                  "mean_total_tokens": 100.0,
                  "ci95_low_total_tokens": 90.0,
                  "ci95_high_total_tokens": 110.0,
                  "mean_cost_usd": 0.01,
                  "ci95_low_cost_usd": 0.009,
                  "ci95_high_cost_usd": 0.011,
                  "mean_wall_seconds": 100.0,
                  "ci95_low_wall_seconds": 90.0,
                  "ci95_high_wall_seconds": 110.0,
                  "run_resolve_rate": 100.0,
                  "run_valid_rate": 100.0,
                  **{f"mean_{metric}": 0.0 for metric in (
                      "input_tokens", "output_tokens", "reasoning_tokens",
                      "cache_read_tokens", "api_calls", "diff_lines"
                  )},
              }]
              write_html_report(
                  report_dir,
                  summary,
                  {"model": "test", "upstream_provider": "test", "seed": 1},
                  analysis_mode="basic",
              )
              assert (report_dir / "report-light.html").is_file()
              assert (report_dir / "report-dark.html").is_file()
              assert (report_dir / "report.html").is_file()
              light = (report_dir / "report-light.html").read_text()
              dark = (report_dir / "report-dark.html").read_text()
              assert "prefers-color-scheme" not in light
              assert "prefers-color-scheme" not in dark
              assert ".light.svg" in light
              assert ".dark.svg" in dark

          # Fresh profile contains only benchmark config/credentials, opts out
          # of bundled skill seeding, and pins the tool-loop budget.
          with tempfile.TemporaryDirectory() as td:
              root = Path(td)
              src = root / "src"
              dst = root / "dst"
              src.mkdir()
              (src / ".env").write_text("OPENROUTER_API_KEY=test-only\n")
              make_profile(src, dst)
              cfg = yaml.safe_load((dst / "config.yaml").read_text())
              assert cfg["agent"]["max_turns"] == 50
              assert TRACE_PLUGIN_NAME in cfg["plugins"]["enabled"]
              assert (dst / "plugins" / TRACE_PLUGIN_NAME / "plugin.yaml").is_file()
              assert (dst / "plugins" / TRACE_PLUGIN_NAME / "__init__.py").is_file()
              assert (dst / ".no-bundled-skills").is_file()
              assert (dst / ".env").is_file()

              pin_profile_route(
                  dst,
                  model="deepseek/deepseek-v4.1-flash",
                  upstream_provider="relace",
                  max_turns=50,
              )
              cfg = yaml.safe_load((dst / "config.yaml").read_text())
              assert cfg["provider_routing"]["only"] == ["relace"]
              assert list(cfg["provider_routing"]["models"]) == [
                  "deepseek/deepseek-v4.1-flash"
              ]
              assert cfg["provider_routing"]["models"]["deepseek/deepseek-v4.1-flash"]["only"] == ["relace"]

              argv = docker_hermes_argv(
                  "sha256:test",
                  dst,
                  ["-z", "hello"],
                  workspace=src,
              )
              assert argv[:4] == ["docker", "run", "--rm", "--pull=never"]
              assert "sha256:test" in argv
              joined = " ".join(argv)
              assert "/opt/data" in joined
              assert "/workspace" in joined
              assert "HERMES_UID=" in joined
              assert "HERMES_GID=" in joined

          # Repeats are complete, independently randomized blocks with distinct
          # recorded seeds rather than one global shuffle.
          plan, repeat_seeds = build_run_plan(
              ["baseline", "caveman", "ponytail", "caveman_ponytail"],
              ["task-a", "task-b", "task-c", "task-d", "task-e"],
              3,
              260920,
          )
          assert len(plan) == 60
          assert len(set(repeat_seeds)) == 3
          expected_pairs = {
              (arm, task)
              for arm in ("baseline", "caveman", "ponytail", "caveman_ponytail")
              for task in ("task-a", "task-b", "task-c", "task-d", "task-e")
          }
          block_orders = []
          for repeat in (1, 2, 3):
              block = [row for row in plan if row["repeat"] == repeat]
              assert len(block) == 20
              assert {(row["arm"], row["instance_id"]) for row in block} == expected_pairs
              assert {row["repeat_seed"] for row in block} == {repeat_seeds[repeat - 1]}
              assert [row["block_position"] for row in block] == list(range(1, 21))
              block_orders.append([(row["arm"], row["instance_id"]) for row in block])
          assert len({tuple(order) for order in block_orders}) == 3

          model_specs = [
              ModelSpec(
                  key="v4",
                  label="V4",
                  model="deepseek/deepseek-v4-flash-0731",
                  upstream_provider="relace",
              ),
              ModelSpec(
                  key="v41",
                  label="V4.1",
                  model="deepseek/deepseek-v4.1-flash",
                  upstream_provider="relace",
              ),
          ]
          multi_plan, multi_seeds = build_run_plan(
              ["baseline", "caveman", "ponytail", "caveman_ponytail"],
              ["task-a", "task-b", "task-c", "task-d", "task-e"],
              1,
              260920,
              models=model_specs,
          )
          assert multi_seeds == [260920]
          assert len(multi_plan) == 40
          expected_cells = {
              (model.key, arm, task)
              for model in model_specs
              for arm in ("baseline", "caveman", "ponytail", "caveman_ponytail")
              for task in ("task-a", "task-b", "task-c", "task-d", "task-e")
          }
          assert {
              (row["model_key"], row["arm"], row["instance_id"])
              for row in multi_plan
          } == expected_cells
          assert [row["block_position"] for row in multi_plan] == list(range(1, 41))
          assert {row["upstream_provider"] for row in multi_plan} == {"relace"}
          unshuffled = [
              (model.key, task, arm)
              for model in model_specs
              for task in ("task-a", "task-b", "task-c", "task-d", "task-e")
              for arm in ("baseline", "caveman", "ponytail", "caveman_ponytail")
          ]
          observed = [
              (row["model_key"], row["instance_id"], row["arm"])
              for row in multi_plan
          ]
          assert observed != unshuffled

          # Synthetic native-hook events produce an auditable direct timing budget.
          synthetic_events = [
              {"event": "post_api_request", "api_duration": 2.0,
               "started_at": 10.0, "first_chunk_at": 10.4, "session_id": "s1"},
              {"event": "post_api_request", "api_duration": 3.0,
               "started_at": 20.0, "first_chunk_at": 20.6, "session_id": "s1"},
              {"event": "post_tool_call", "tool_name": "terminal", "duration_ms": 1500,
               "session_id": "s1"},
              {"event": "post_tool_call", "tool_name": "read_file", "duration_ms": 500,
               "session_id": "s1"},
              {"event": "on_skill_lifecycle", "skill_name": "caveman", "action": "viewed",
               "session_id": "s1"},
          ]
          timing = summarize_events(synthetic_events, 10.0)
          assert timing["api_wait_seconds"] == 5.0
          assert timing["tool_execution_seconds"] == 2.0
          assert timing["terminal_execution_seconds"] == 1.5
          assert timing["unattributed_wall_seconds"] == 3.0
          assert timing["caveman_skill_observed"] is True
          assert timing["session_ids"] == ["s1"]

          # Patch capture must include both committed changes and untracked files.
          with tempfile.TemporaryDirectory() as td:
              repo = Path(td)
              subprocess.run(["git", "init", "-q"], cwd=repo, check=True)
              subprocess.run(["git", "config", "user.email", "ci@example.test"], cwd=repo, check=True)
              subprocess.run(["git", "config", "user.name", "CI"], cwd=repo, check=True)
              (repo / "a.txt").write_text("base\n")
              subprocess.run(["git", "add", "a.txt"], cwd=repo, check=True)
              subprocess.run(["git", "commit", "-qm", "base"], cwd=repo, check=True)
              base = subprocess.check_output(["git", "rev-parse", "HEAD"], cwd=repo, text=True).strip()
              (repo / "a.txt").write_text("committed change\n")
              subprocess.run(["git", "add", "a.txt"], cwd=repo, check=True)
              subprocess.run(["git", "commit", "-qm", "agent commit"], cwd=repo, check=True)
              (repo / "new.txt").write_text("untracked\n")
              files, lines, patch = diff_stats(repo, base)
              assert files == 2
              assert lines >= 2
              assert "a.txt" in patch and "new.txt" in patch

          # Support the SWE-bench 4.1 report location and newer location.
          with tempfile.TemporaryDirectory() as td:
              root = Path(td)
              run_id = "run1"
              old_report = root / f"forge-bench.{run_id}.json"
              old_report.write_text(json.dumps({"resolved_ids": ["x"]}))
              assert load_swebench_report(root, "forge-bench", run_id)["resolved_ids"] == ["x"]
              old_report.unlink()
              new_report = root / "logs" / "evaluation" / run_id / "results.json"
              new_report.parent.mkdir(parents=True)
              new_report.write_text(json.dumps({"resolved_ids": []}))
              assert load_swebench_report(root, "forge-bench", run_id)["resolved_ids"] == []

          f = patch_features("""diff --git a/a.py b/a.py
          --- a/a.py
          +++ b/a.py
          @@ -1 +1,2 @@
          -old
          +new
          +more
          """)
          assert f["patch_files"] == 1
          assert f["patch_hunks"] == 1
          assert f["patch_changed_lines"] == 3

          candidates = []
          for i, score in enumerate((0.18, 0.49, 0.81, 0.95)):
              candidates.append(Candidate(
                  instance_id=f"x-{i}", repo=f"org/r{i}", base_commit="a"*40,
                  difficulty="medium", problem_statement="", version="",
                  patch_files=1, patch_hunks=1, patch_additions=1,
                  patch_deletions=1, patch_changed_lines=2, patch_chars=100,
                  fail_to_pass_count=1, pass_to_pass_count=1,
                  historical_solve_rate=0.5, historical_submissions=10,
                  complexity_score=score,
              ))
          chosen = select_spread(candidates, count=3)
          assert [c.instance_id for c in chosen] == ["x-0", "x-1", "x-2"]
          assert [c.selection_rank for c in chosen] == ["low", "mid", "high"]

          anchor_candidates = []
          specs = [
              ("anchor-a", 4, 1, 0.84, "short issue"),
              ("anchor-b", 4, 2, 0.79, "another short issue"),
              ("near-1", 5, 1, 0.82, "similar short issue"),
              ("near-2", 3, 2, 0.80, "similar issue text"),
              ("near-3", 6, 1, 0.83, "short issue text"),
              ("far", 10, 3, 0.72, "word " * 200),
          ]
          for i, (instance_id, lines, hunks, rate, statement) in enumerate(specs):
              anchor_candidates.append(Candidate(
                  instance_id=instance_id, repo=f"org/a{i}", base_commit="b"*40,
                  difficulty="medium", problem_statement=statement, version="",
                  patch_files=1, patch_hunks=hunks, patch_additions=lines,
                  patch_deletions=0, patch_changed_lines=lines, patch_chars=120 + lines,
                  fail_to_pass_count=1, pass_to_pass_count=2,
                  historical_solve_rate=rate, historical_submissions=10,
              ))
          homogeneous = select_anchor_neighborhood(
              anchor_candidates,
              anchor_ids=("anchor-a", "anchor-b"),
              count=5,
          )
          assert [c.instance_id for c in homogeneous[:2]] == ["anchor-a", "anchor-b"]
          assert "far" not in [c.instance_id for c in homogeneous]
          assert [c.selection_rank for c in homogeneous] == [
              "anchor-1", "anchor-2", "match-1", "match-2", "match-3"
          ]

          # Multi-model reporting keeps model conditions separate instead of
          # treating model identity as a repeated observation of one treatment.
          synthetic_results = []
          run_index = 0
          for model_i, model_spec in enumerate(model_specs):
              for task_i, task in enumerate(("task-a", "task-b", "task-c", "task-d", "task-e")):
                  for arm_i, arm in enumerate(("baseline", "caveman", "ponytail", "caveman_ponytail")):
                      run_index += 1
                      multiplier = 1.0 - 0.08 * arm_i - 0.10 * model_i
                      synthetic_results.append(Result(
                          arm=arm,
                          task=task,
                          repeat=1,
                          run_index=run_index,
                          valid=True,
                          resolved=True,
                          evaluation_completed=True,
                          patch_nonempty=True,
                          completed=True,
                          exit_code=0,
                          wall_seconds=(100 + task_i) * multiplier,
                          evaluation_seconds=1.0,
                          repo="org/repo",
                          difficulty="medium",
                          model=model_spec.model,
                          api_provider="openrouter",
                          upstream_provider="relace",
                          session_id=f"s{run_index}",
                          input_tokens=int(50000 * multiplier),
                          output_tokens=int(5000 * multiplier),
                          reasoning_tokens=0,
                          cache_read_tokens=int(400000 * multiplier),
                          cache_write_tokens=0,
                          total_tokens=int(455000 * multiplier),
                          api_calls=max(1, int(30 * multiplier)),
                          estimated_cost_usd=0.01 * multiplier,
                          actual_cost_usd=0.01 * multiplier,
                          cost_usd=0.01 * multiplier,
                          cost_source="openrouter_actual",
                          tool_calls=max(1, int(40 * multiplier)),
                          files_changed=1,
                          diff_lines=4,
                          run_dir=f"/tmp/run-{run_index}",
                      ))
          with tempfile.TemporaryDirectory() as td:
              report_root = Path(td)
              meta = {
                  "design_name": "synthetic-two-model",
                  "models": [model.as_dict() for model in model_specs],
                  "seed": 260920,
                  "upstream_provider": "relace",
              }
              write_experiment_reports(
                  report_root,
                  synthetic_results,
                  ["baseline", "caveman", "ponytail", "caveman_ponytail"],
                  ["task-a", "task-b", "task-c", "task-d", "task-e"],
                  meta,
                  analysis_mode="basic",
              )
              assert (report_root / "model_task_summary.csv").is_file()
              assert (report_root / "model_treatment_summary.csv").is_file()
              assert (report_root / "model_pairwise_effects.csv").is_file()
              assert (report_root / "models" / "v4" / "report-light.html").is_file()
              assert (report_root / "models" / "v41" / "report-dark.html").is_file()
              assert (report_root / "report.html").is_file()

          # Advanced analysis operates on task-level means and supports the
          # default Caveman x Ponytail 2x2.
          analysis_rows = []
          multipliers = {
              "baseline": 1.00,
              "caveman": 0.72,
              "ponytail": 0.78,
              "caveman_ponytail": 0.52,
          }
          for task_i, task in enumerate(("task-a", "task-b", "task-c", "task-d", "task-e")):
              base = 700000 + task_i * 25000
              for arm, multiplier in multipliers.items():
                  analysis_rows.append({
                      "arm": arm,
                      "label": arm,
                      "task": task,
                      "valid_runs": 1,
                      "total_tokens": base * multiplier,
                      "wall_seconds": (180 + task_i * 4) * multiplier,
                      "api_calls": (40 + task_i) * multiplier,
                      "cost_usd": 0.015 * multiplier,
                      "tool_calls": (55 + task_i) * multiplier,
                      "tokens_per_second": (base * multiplier) / ((180 + task_i * 4) * multiplier),
                      "seconds_per_api_call": ((180 + task_i * 4) * multiplier) / ((40 + task_i) * multiplier),
                      "tokens_per_api_call": (base * multiplier) / ((40 + task_i) * multiplier),
                      "cost_per_api_call": (0.015 * multiplier) / ((40 + task_i) * multiplier),
                      "cost_per_second": (0.015 * multiplier) / ((180 + task_i * 4) * multiplier),
                      "seconds_per_tool_call": ((180 + task_i * 4) * multiplier) / ((55 + task_i) * multiplier),
                      "tool_calls_per_api_call": ((55 + task_i) * multiplier) / ((40 + task_i) * multiplier),
                      "api_wait_seconds": (180 + task_i * 4) * multiplier * 0.55,
                      "tool_execution_seconds": (180 + task_i * 4) * multiplier * 0.25,
                      "terminal_execution_seconds": (180 + task_i * 4) * multiplier * 0.15,
                      "unattributed_wall_seconds": (180 + task_i * 4) * multiplier * 0.20,
                      "api_duration_mean_seconds": ((180 + task_i * 4) * multiplier * 0.55) / ((40 + task_i) * multiplier),
                      "api_duration_p95_seconds": 3.0 + task_i * 0.1,
                      "ttft_mean_seconds": 0.35 + task_i * 0.02,
                      "api_wait_fraction": 0.55,
                      "tool_execution_fraction": 0.25,
                      "diff_lines": 4 + task_i,
                  })
          effects = paired_effects(analysis_rows)
          assert any(row["arm"] == "caveman_ponytail" for row in effects)
          regressions = treatment_regression(analysis_rows)
          assert any(row["term"] == "caveman" for row in regressions)
          factorial = factorial_regression(analysis_rows)
          assert {row["term"] for row in factorial if row["metric"] == "total_tokens"} == {
              "caveman", "ponytail", "interaction"
          }
          scores, loadings, explained = pca_analysis(analysis_rows)
          assert len(scores) == 20 and len(loadings) >= 2 and len(explained) >= 2
          cost_time, cost_time_corr = cost_time_analysis(analysis_rows)
          assert len(cost_time) == 4
          assert all("pareto_efficient" in row for row in cost_time)
          assert -1.0 <= cost_time_corr <= 1.0
          latency = latency_efficiency_analysis(analysis_rows)
          assert any(row["metric"] == "tokens_per_second" for row in latency)
          assert any(row["metric"] == "seconds_per_api_call" for row in latency)
          timing = timing_evidence_summary(analysis_rows)
          assert timing[0]["rows_with_tool_call_count"] == 20
          assert timing[0]["exact_api_wait_seconds_available"] is True
          assert timing[0]["exact_tool_execution_seconds_available"] is True
          budgets = time_budget_analysis(analysis_rows)
          assert len(budgets) == 4
          assert all(row["n_tasks"] == 5 for row in budgets)

          with tempfile.TemporaryDirectory() as td:
              analysis_dir = Path(td)
              generated = write_advanced_analysis(analysis_dir, analysis_rows)
              assert "advanced_paired_effects.csv" in generated
              assert (analysis_dir / "advanced_pca_biplot.light.png").is_file()
              assert (analysis_dir / "advanced_pca_biplot.dark.png").is_file()
              assert (analysis_dir / "advanced_pca_scree.light.svg").is_file()
              assert (analysis_dir / "advanced_pca_loadings.dark.svg").is_file()
              assert (analysis_dir / "advanced_clusters.light.svg").is_file()
              assert (analysis_dir / "advanced_correlations.dark.svg").is_file()
              assert (analysis_dir / "advanced_cost_time.light.png").is_file()
              assert (analysis_dir / "advanced_cost_time.dark.svg").is_file()
              assert (analysis_dir / "advanced_time_budget.light.png").is_file()
              assert (analysis_dir / "advanced_time_budget.dark.svg").is_file()
              assert (analysis_dir / "advanced_api_latency.light.png").is_file()
              assert (analysis_dir / "advanced_time_budget.csv").is_file()
              assert (analysis_dir / "advanced_time_vs_api_calls.light.png").is_file()
              assert (analysis_dir / "advanced_tokens_per_second.dark.svg").is_file()
              assert (analysis_dir / "advanced_seconds_per_api_call.light.png").is_file()
              assert (analysis_dir / "advanced_tokens_per_api_call.dark.png").is_file()
              assert (analysis_dir / "advanced_tool_calls_per_api_call.light.svg").is_file()
              assert (analysis_dir / "advanced_seconds_per_tool_call.dark.svg").is_file()
              assert (analysis_dir / "advanced_latency_efficiency.csv").is_file()
              assert (analysis_dir / "advanced_timing_evidence.csv").is_file()
          PY
      - run: uv run forge-bench --help
      - name: Verify reanalysis CLI accepts existing output
        run: |
          uv run forge-bench --help | grep -q -- '--reanalyze'
          uv run forge-bench --help | grep -q -- '--analysis-mode'
          uv run forge-bench --help | grep -q -- '--open'
          uv run forge-bench --help | grep -q -- '--design'
          uv run forge-bench --help | grep -q -- '--plan-only'
          uv run forge-bench --help | grep -q -- 'timestamped subfolder'
      - name: Verify two-model design plan without model calls
        run: |
          rm -rf /tmp/forge-bench-design-plan
          uv run forge-bench             --design designs/deepseek-v4-v41-relace.yaml             --plan-only             --output /tmp/forge-bench-design-plan
          test -f /tmp/forge-bench-design-plan/design.yaml
          test -f /tmp/forge-bench-design-plan/run_plan.csv
          test "$(tail -n +2 /tmp/forge-bench-design-plan/run_plan.csv | wc -l)" -eq 40
          grep -q 'deepseek/deepseek-v4-flash-0731' /tmp/forge-bench-design-plan/run_plan.csv
          grep -q 'deepseek/deepseek-v4.1-flash' /tmp/forge-bench-design-plan/run_plan.csv
          test "$(grep -c ',relace,' /tmp/forge-bench-design-plan/run_plan.csv)" -eq 40

      - name: Verify homogeneous default SWE-bench suite
        run: |
          uv run forge-bench --selection-only --output /tmp/forge-bench-selection
          grep -q '"instance_id": "django__django-13516"' /tmp/forge-bench-selection/selection.json
          grep -q '"instance_id": "pytest-dev__pytest-7571"' /tmp/forge-bench-selection/selection.json
          grep -q '"instance_id": "django__django-15731"' /tmp/forge-bench-selection/selection.json
          grep -q '"instance_id": "django__django-16662"' /tmp/forge-bench-selection/selection.json
          grep -q '"instance_id": "django__django-7530"' /tmp/forge-bench-selection/selection.json
          test "$(grep -c '"instance_id"' /tmp/forge-bench-selection/selection.json)" -eq 5
